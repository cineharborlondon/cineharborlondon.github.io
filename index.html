<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eee7d9">
  <meta name="description" content="Cine Harbor is a London-based creative production studio working across film, commercial, social content and photography. A feeling. A frame. A story.">
  <title>Cine Harbor — A feeling. A frame. A story.</title>
  <link rel="icon" href="assets/favicon.svg?v=845" type="image/svg+xml">
  <link rel="stylesheet" href="landing.css?v=selected-20261006-1">
  <script>
    // Keep existing project return links and bookmarked Work categories working.
    function openLegacyWork() {
      if (/^#(work|films|commercials|photography|social)$/.test(location.hash)) {
        location.replace('work.html' + location.search + location.hash);
      }
    }
    openLegacyWork();
    addEventListener('hashchange', openLegacyWork);
  </script>
  <script src="landing-frames.js?v=selected-20261006-1" defer></script>
  <script src="landing.js?v=selected-20261006-1" defer></script>
</head>
<body>
  <a class="enter-work" href="work.html" aria-label="Enter Work" aria-describedby="entry-help"></a>
  <span class="visually-hidden" id="entry-help">Press Enter to explore our work. Press Space to pause or resume the background.</span>
  <span class="visually-hidden" id="frame-status" role="status" aria-live="polite"></span>
  <div class="landing-shell">
    <main id="home" class="landing-main">
      <div class="title-stage">
        <h1 class="image-title" id="image-title" aria-label="Cine Harbor"><span class="title-cine" aria-hidden="true">CINE</span><span class="title-harbor" aria-hidden="true">HARBOR</span></h1>
      </div>
    </main>
    <footer class="landing-footer">
      <p class="slogan">A feeling. A frame. A story.</p>
    </footer>
  </div>
</body>
</html>
